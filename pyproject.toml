[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-chi-former"
version = "0.1.0"
description = "Geophysics-guided excitation forecasting for polar motion"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.7.1",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scikit-learn==1.6.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "models*", "scripts*", "utils*"]
exclude = ["tests*"]
